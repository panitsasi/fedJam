[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedjam-flower"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.17.0",
    "flwr-datasets[vision]>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fj"

[tool.flwr.app.components]
serverapp = "fedjam_flower.server_app:app"
clientapp = "fedjam_flower.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 6
fraction-fit = 0.5
local-epochs = 1

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 6
options.backend.client-resources.num-cpus = 12
options.backend.client-resources.num-gpus = 0.5