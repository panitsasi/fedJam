[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedjam-flower"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.17.0",
    "flwr-datasets[vision]>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fj"

[tool.flwr.app.components]
serverapp = "fedjam_flower.server_app:app"
clientapp = "fedjam_flower.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 1
fraction-fit = 1
local-epochs = 1
model_name = "vit_base_patch16_224"
learning-rate-max = 5e-5
learning-rate-min = 1e-6
num_clients = 2
fft = 1024
data_dir = "/home/ioannis/Desktop/spectrograms/dataset_v3/spectro_flower_fft/fft_1024"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2
options.backend.client-resources.num-cpus = 24
options.backend.client-resources.num-gpus = 0.3
