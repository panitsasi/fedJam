[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedjam-flower"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.17.0",
    "flwr-datasets[vision]>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fj"

[tool.flwr.app.components]
serverapp = "fedjam_flower.server_app:app"
clientapp = "fedjam_flower.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 50
fraction-fit = 1
local-epochs = 1
model_name = "multimodal"
learning-rate-max = 5e-4
learning-rate-min = 1e-6
batch_size = 256
dataset_version = "multimodal"
data_dir = "/home/iofeidis/workspace/hf_dataset.down75.len256.cols_all"
fft = 0
gain = 0
num_clients = 10
is_lora = false
is_timm = false
is_warmup = false
random_seed = 42
classes_per_partition = 4 # IID: 4, Non-IID: < 4
modality = "both"  # Options: "both", "image", or "timeseries"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 10
options.backend.client-resources.num-gpus = 0.5

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true
